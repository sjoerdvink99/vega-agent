name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: make install
      - run: make check
      - run: make docs
        if: matrix.python != '3.10'
