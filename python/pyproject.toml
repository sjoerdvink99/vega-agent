[project]
name = "vega-agent"
dynamic = ["version"]
description = "A grammar for agent processes: specify, parse, query and visualize agent traces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sjoerd Vink" }]
keywords = ["agents", "llm", "traces", "opentelemetry", "visualization", "grammar", "process-mining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["anywidget>=0.9", "pandas>=2.0"]

[project.urls]
Documentation = "https://sjoerdvink99.github.io/vega-agent/"
Repository = "https://github.com/sjoerdvink99/vega-agent"
Issues = "https://github.com/sjoerdvink99/vega-agent/issues"
Changelog = "https://github.com/sjoerdvink99/vega-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390", "nbclient>=0.10", "ipykernel>=6", "pm4py>=2.7", "jsonschema>=4"]
notebook = ["jupyterlab>=4"]
docs = ["zensical>=0.0.73; python_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vega_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vega_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:::pm4py.*", "ignore::PendingDeprecationWarning:numpy.*", "error:::vega_agent", "error:::vega_agent\\..*"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
